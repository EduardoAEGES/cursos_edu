<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repositorio de recursos de Eduardo</title>
<style>
  :root{
    --bg: #0f172a;
    --bg-soft: #1e293b;
    --accent: #38bdf8;
    --accent-2: #f472b6;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0f172a 60%);
    color: var(--text);
  }
  header{
    text-align:center;
    padding: 60px 20px 30px;
  }
  header h1{
    margin:0 0 10px;
    font-size: clamp(28px, 5vw, 44px);
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p{
    color: var(--text-dim);
    margin:0;
    font-size: 16px;
  }
  main{
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 20px 80px;
    text-align:center;
  }
  #openDadoBtn{
    margin-top: 20px;
    padding: 14px 32px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0f172a;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #openDadoBtn:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(56, 189, 248, 0.35);
  }

  /* Modal */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.hidden{ display:none; }
  .modal{
    background: var(--bg-soft);
    border-radius: 16px;
    padding: 28px;
    max-width: 480px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h2{
    margin-top:0;
    text-align:center;
  }
  #closeDadoBtn{
    position:absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 22px;
    cursor: pointer;
    line-height:1;
  }
  #closeDadoBtn:hover{ color: var(--text); }

  /* Dice scene with strong perspective */
  .dice-stage{
    position: relative;
    margin: 36px auto 24px;
    width: 220px;
    height: 200px;
    perspective: 700px;
    perspective-origin: 50% 40%;
  }
  .dice-scene{
    position:absolute;
    top: 30px;
    left: 50%;
    margin-left: -70px;
    width: 140px;
    height: 140px;
    transform-style: preserve-3d;
  }
  .cube{
    position: relative;
    width: 140px;
    height: 140px;
    transform-style: preserve-3d;
    transform: rotateX(-24deg) rotateY(-24deg);
    transition: transform 1.6s cubic-bezier(.2,.85,.25,1);
  }
  .cube.rolling{
    animation: tumble 1.6s cubic-bezier(.2,.85,.25,1);
  }
  @keyframes tumble{
    0%   { }
    100% { }
  }
  .face{
    position:absolute;
    width: 140px;
    height: 140px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 52px;
    font-weight: 800;
    border-radius: 22px;
    border: 2px solid rgba(255,255,255,.35);
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.85), rgba(255,255,255,0) 55%),
      linear-gradient(135deg, #ffffff 0%, #e2e8f0 55%, #cbd5e1 100%);
    color: #0f172a;
    user-select:none;
    box-shadow:
      inset 0 0 22px rgba(0,0,0,.18),
      inset 6px 6px 14px rgba(255,255,255,.55);
    text-shadow: 0 1px 1px rgba(255,255,255,.6);
  }
  /* Face-specific darkening to simulate lighting on different sides */
  .f1{ transform: translateZ(70px); }
  .f6{ transform: rotateY(180deg) translateZ(70px); filter: brightness(.82); }
  .f3{ transform: rotateY(90deg) translateZ(70px); filter: brightness(.9); }
  .f4{ transform: rotateY(-90deg) translateZ(70px); filter: brightness(.9); }
  .f5{ transform: rotateX(90deg) translateZ(70px); filter: brightness(1.05); }
  .f2{ transform: rotateX(-90deg) translateZ(70px); filter: brightness(.86); }

  /* Ground shadow under the dice */
  .dice-shadow{
    position:absolute;
    left: 50%;
    bottom: 6px;
    width: 150px;
    height: 34px;
    margin-left: -75px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,0) 70%);
    border-radius: 50%;
    filter: blur(2px);
    transition: transform 1.6s ease, opacity 1.6s ease;
  }
  .dice-shadow.rolling{
    animation: shadowPulse 1.6s ease;
  }
  @keyframes shadowPulse{
    0%   { transform: scale(1); opacity:.9; }
    30%  { transform: scale(.7); opacity:.5; }
    60%  { transform: scale(1.15); opacity:.95; }
    100% { transform: scale(1); opacity:.9; }
  }

  .dice-controls{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 10px;
    margin-top: 10px;
  }
  .control-row{
    display:flex;
    align-items:center;
    gap: 14px;
  }
  #rollBtn{
    padding: 10px 26px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #0f172a;
    cursor:pointer;
  }
  #rollBtn:disabled{ opacity:.6; cursor:not-allowed; }
  #soundToggle{
    background: transparent;
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  #soundToggle.on{ border-color: var(--accent); color: var(--accent); }
  #resultText{
    color: var(--text-dim);
    min-height: 20px;
  }

  details.customize{
    margin-top: 24px;
    border-top: 1px solid rgba(255,255,255,.1);
    padding-top: 16px;
  }
  details.customize summary{
    cursor:pointer;
    font-weight:600;
    color: var(--accent);
  }
  .customize-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .customize-row{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .customize-row label{
    width: 60px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .customize-row input[type="text"]{
    flex:1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.15);
    background: #0f172a;
    color: var(--text);
  }
  .customize-row input[type="color"]{
    width: 36px;
    height: 32px;
    border: none;
    border-radius: 6px;
    background: none;
    cursor:pointer;
    padding:0;
  }
  .customize-actions{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-top: 16px;
  }
  .customize-actions button{
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    cursor:pointer;
    font-weight: 600;
  }
  #saveCustomBtn{ background: var(--accent-2); color: #0f172a; }
  #resetCustomBtn{ background: transparent; border: 1px solid var(--text-dim); color: var(--text-dim); }

  .hidden{ display:none; }
</style>
</head>
<body>

<header>
  <h1>Repositorio de recursos de Eduardo</h1>
  <p>Materiales, herramientas y utilidades en un solo lugar</p>
</header>

<main>
  <button id="openDadoBtn">🎲 Dado</button>
</main>

<div id="dadoOverlay" class="modal-overlay hidden">
  <div class="modal">
    <button id="closeDadoBtn" aria-label="Cerrar">✕</button>
    <h2>Dado 3D</h2>

    <div class="dice-stage">
      <div class="dice-scene">
        <div class="cube" id="cube">
          <div class="face f1" data-face="1"></div>
          <div class="face f2" data-face="2"></div>
          <div class="face f3" data-face="3"></div>
          <div class="face f4" data-face="4"></div>
          <div class="face f5" data-face="5"></div>
          <div class="face f6" data-face="6"></div>
        </div>
      </div>
      <div class="dice-shadow" id="diceShadow"></div>
    </div>

    <div class="dice-controls">
      <div class="control-row">
        <button id="rollBtn">Lanzar dado</button>
        <button id="soundToggle" class="on" aria-pressed="true">🔊 Sonido</button>
      </div>
      <span id="resultText"></span>
    </div>

    <details class="customize">
      <summary>Personalizar caras</summary>
      <div class="customize-grid" id="customizeGrid"></div>
      <div class="customize-actions">
        <button id="saveCustomBtn">Guardar</button>
        <button id="resetCustomBtn">Restablecer</button>
      </div>
    </details>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'dadoCustomFaces';
  const SOUND_KEY = 'dadoSound';
  const defaults = [
    { text: '1', color: '#f8fafc' },
    { text: '2', color: '#f8fafc' },
    { text: '3', color: '#f8fafc' },
    { text: '4', color: '#f8fafc' },
    { text: '5', color: '#f8fafc' },
    { text: '6', color: '#f8fafc' }
  ];

  const openBtn = document.getElementById('openDadoBtn');
  const closeBtn = document.getElementById('closeDadoBtn');
  const overlay = document.getElementById('dadoOverlay');
  const cube = document.getElementById('cube');
  const diceShadow = document.getElementById('diceShadow');
  const rollBtn = document.getElementById('rollBtn');
  const soundToggle = document.getElementById('soundToggle');
  const resultText = document.getElementById('resultText');
  const customizeGrid = document.getElementById('customizeGrid');
  const saveCustomBtn = document.getElementById('saveCustomBtn');
  const resetCustomBtn = document.getElementById('resetCustomBtn');

  const faceEls = {};
  for (let i = 1; i <= 6; i++) {
    faceEls[i] = document.querySelector('.face[data-face="' + i + '"]');
  }

  // Cube rotation (in degrees) that brings each face to the front.
  const baseRotation = {
    1: { x: 0,   y: 0   },
    2: { x: 90,  y: 0   },
    3: { x: 0,   y: -90 },
    4: { x: 0,   y: 90  },
    5: { x: -90, y: 0   },
    6: { x: 0,   y: 180 }
  };

  let currentX = -24;
  let currentY = -24;
  let rolling = false;

  // ---- Sound (Web Audio API, synthesised so no asset files needed) ----
  let soundOn = true;
  try {
    const stored = localStorage.getItem(SOUND_KEY);
    if (stored === 'off') soundOn = false;
  } catch (e) {}
  updateSoundToggle();

  let audioCtx = null;
  function getCtx(){
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // A short noise burst = one "clack" of the dice hitting a surface.
  function playClack(ctx, when, gainValue){
    const dur = 0.08;
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      // decaying white noise
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.5);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 900 + Math.random() * 700;
    filter.Q.value = 1.2;
    const gain = ctx.createGain();
    gain.gain.value = gainValue;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start(when);
    src.stop(when + dur);
  }

  function playRollSound(){
    if (!soundOn) return;
    const ctx = getCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    // Several clacks getting faster then settling = tumbling dice.
    const times = [0, 0.11, 0.24, 0.4, 0.6, 0.85, 1.15, 1.45];
    times.forEach((t, i) => {
      const g = 0.35 * (1 - i / (times.length + 1));
      playClack(ctx, now + t, Math.max(0.08, g));
    });
  }

  function updateSoundToggle(){
    if (soundOn) {
      soundToggle.classList.add('on');
      soundToggle.textContent = '🔊 Sonido';
      soundToggle.setAttribute('aria-pressed', 'true');
    } else {
      soundToggle.classList.remove('on');
      soundToggle.textContent = '🔇 Sonido';
      soundToggle.setAttribute('aria-pressed', 'false');
    }
  }

  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (e) {}
    updateSoundToggle();
    if (soundOn) { const ctx = getCtx(); if (ctx) playClack(ctx, ctx.currentTime, 0.25); }
  });

  // ---- Faces ----
  function normalize(deg){
    return ((deg % 360) + 360) % 360;
  }

  function loadFaces(){
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved) && saved.length === 6) return saved;
    } catch (e) {}
    return defaults.map(f => ({ ...f }));
  }

  function applyFaces(faces){
    faces.forEach((f, idx) => {
      const el = faceEls[idx + 1];
      el.textContent = f.text;
      el.style.background = f.color;
    });
  }

  function buildCustomizeForm(faces){
    customizeGrid.innerHTML = '';
    faces.forEach((f, idx) => {
      const n = idx + 1;
      const row = document.createElement('div');
      row.className = 'customize-row';
      row.innerHTML =
        '<label for="text-' + n + '">Cara ' + n + '</label>' +
        '<input type="text" id="text-' + n + '" maxlength="4" value="' + f.text.replace(/"/g, '&quot;') + '">' +
        '<input type="color" id="color-' + n + '" value="' + f.color + '">';
      customizeGrid.appendChild(row);
    });
  }

  function readCustomizeForm(){
    const faces = [];
    for (let n = 1; n <= 6; n++) {
      const text = document.getElementById('text-' + n).value.trim() || String(n);
      const color = document.getElementById('color-' + n).value;
      faces.push({ text, color });
    }
    return faces;
  }

  let faces = loadFaces();
  applyFaces(faces);
  buildCustomizeForm(faces);

  function openModal(){ overlay.classList.remove('hidden'); }
  function closeModal(){ overlay.classList.add('hidden'); }

  openBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeModal();
  });

  function roll(){
    if (rolling) return;
    rolling = true;
    rollBtn.disabled = true;
    resultText.textContent = '';

    playRollSound();

    const target = 1 + Math.floor(Math.random() * 6);
    const base = baseRotation[target];
    // Keep a slight tilt so the landing pose still looks 3D, not flat.
    const baseX = normalize(base.x) - 18;
    const baseY = normalize(base.y) + 18;

    // Multiple full spins on all axes for a lively tumble.
    const spinX = (2 + Math.floor(Math.random() * 3)) * 360;
    const spinY = (2 + Math.floor(Math.random() * 3)) * 360;

    const deltaX = normalize(baseX - normalize(currentX));
    const deltaY = normalize(baseY - normalize(currentY));

    currentX += spinX + deltaX;
    currentY += spinY + deltaY;

    diceShadow.classList.add('rolling');
    cube.style.transform = 'rotateX(' + currentX + 'deg) rotateY(' + currentY + 'deg)';

    setTimeout(() => {
      diceShadow.classList.remove('rolling');
      resultText.textContent = 'Resultado: ' + faceEls[target].textContent;
      rolling = false;
      rollBtn.disabled = false;
    }, 1620);
  }

  rollBtn.addEventListener('click', roll);

  saveCustomBtn.addEventListener('click', () => {
    faces = readCustomizeForm();
    applyFaces(faces);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(faces)); } catch (e) {}
    resultText.textContent = 'Caras guardadas';
  });

  resetCustomBtn.addEventListener('click', () => {
    faces = defaults.map(f => ({ ...f }));
    applyFaces(faces);
    buildCustomizeForm(faces);
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    resultText.textContent = 'Caras restablecidas';
  });
})();
</script>

</body>
</html>
