<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía de la plantilla de costos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: asistente paso a paso. Una ficha central por paso, con una hoja de Excel simulada que se va llenando,
   un guía que explica y botones Anterior / Siguiente. Paleta de la plantilla: carbón, verde petróleo, bronce. */
:root{
  --bg:#F5F6F5; --surface:#FFFFFF; --ink:#2F363D; --muted:#5F6B73; --line:#D9DEE0;
  --teal:#0F766E; --teal-soft:#E6F2EF; --bronze:#9A7B4F; --bronze-soft:#F3EDE3; --grid:#ECEFF1;
  --head-bg:#2F363D; --on-teal:#FFFFFF; --rose:#F4C9B8; --choc:#7A4A2B; --crust:#E0B06B;
  --display:"Sora","Segoe UI",Arial,sans-serif; --body:"Public Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171B1F; --surface:#20262B; --ink:#E8ECEE; --muted:#A3AEB5; --line:#343C43;
    --teal:#4FB8AD; --teal-soft:#16302E; --bronze:#CDA873; --bronze-soft:#33291B; --grid:#2A3137;
    --head-bg:#101316; --on-teal:#101316; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171B1F; --surface:#20262B; --ink:#E8ECEE; --muted:#A3AEB5; --line:#343C43;
  --teal:#4FB8AD; --teal-soft:#16302E; --bronze:#CDA873; --bronze-soft:#33291B; --grid:#2A3137;
  --head-bg:#101316; --on-teal:#101316; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font-family:var(--body)}
:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:var(--head-bg);color:#FFFFFF;padding:18px 0}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
header h1{font-size:20px;flex:1 1 260px}
.pill{border:1px solid #56616A;border-radius:999px;padding:4px 12px;font-size:13px;color:#FFFFFF;background:transparent}
button.pill{cursor:pointer}
button.pill:hover{background:#3D464E}
.prog{height:6px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s ease}
main{padding:24px 0 48px;display:flex;flex-direction:column;gap:18px}
.stage{animation:enter .45s ease both}
@keyframes enter{from{opacity:.0;transform:translateX(26px)}to{opacity:1;transform:none}}
.stage.back{animation-name:enterb}
@keyframes enterb{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.intro{display:flex;flex-direction:column;gap:8px}
.intro h2{font-size:clamp(24px,4.5vw,34px)}
.intro p{color:var(--muted);max-width:64ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:10px}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink);transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-4px);border-color:var(--teal)}
.choice .art{display:flex;gap:4px;height:96px;align-items:flex-end}
.choice .art svg{height:88px;width:auto;flex:0 1 88px}
.choice.many .art svg{height:62px;flex-basis:62px}
.choice b{font:700 17px var(--display)}
.choice span{font-size:14px;color:var(--muted)}
.choice em{font-style:normal;font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.shead{display:flex;gap:14px;align-items:center}
.shead img{width:54px;height:54px;flex:none;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.shead small{display:block;font-size:13px;font-weight:700;color:var(--teal);letter-spacing:.03em}
.shead h2{font-size:clamp(20px,3.6vw,26px)}
.where{display:inline-flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--grid);border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600}
.say{display:flex;gap:12px;align-items:flex-start;background:var(--bronze-soft);border-radius:14px;padding:12px 14px;max-width:76ch}
.say img{width:52px;height:52px;flex:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.say .who{font-weight:700;font-size:13px;color:var(--bronze)}
.say p{font-size:15px}
ol.do{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:72ch;font-size:15px}
.xl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.xl table{border-collapse:collapse;font-size:13.5px;min-width:100%;font-variant-numeric:tabular-nums}
.xl th{background:var(--grid);color:var(--muted);font:600 12px var(--body);padding:3px 8px;border:1px solid var(--line);text-align:center}
.xl td{border:1px solid var(--line);padding:5px 9px;white-space:nowrap;background:var(--surface)}
.xl td.rn{background:var(--grid);color:var(--muted);font-size:12px;text-align:center;width:34px}
.xl tr.hd td:not(.rn){background:var(--grid);font-weight:700;font-size:12.5px;white-space:normal;min-width:96px;max-width:170px;text-align:center;vertical-align:middle}
.xl td.lb{font-weight:600}
.xl td.in{background:var(--teal-soft);color:var(--teal);font-weight:600}
.xl td.in span{display:inline-block;animation:type .35s ease both;animation-delay:calc(var(--i)*55ms + .25s)}
.xl td.r{text-align:right}
.xl td.off{color:var(--muted);font-size:12.5px}
@keyframes type{from{opacity:0;transform:translateY(6px) scale(.8)}to{opacity:1;transform:none}}
.legend{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:34px;height:16px;border-radius:4px;background:var(--teal-soft);border:1px solid var(--teal)}
.nav{display:flex;justify-content:space-between;gap:12px;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:16px;cursor:pointer}
.btn.next{background:var(--teal);color:var(--on-teal);animation:nudge 2.4s ease-in-out 1.2s infinite}
.btn.prev{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
@keyframes nudge{0%,80%,100%{transform:none}90%{transform:translateX(5px)}}
.count{font-size:14px;color:var(--muted);font-weight:600}
.tabs{display:inline-flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border-radius:12px;padding:12px 14px;color:#FFFFFF;display:flex;flex-direction:column;gap:2px;animation:pop .45s cubic-bezier(.3,1.4,.5,1) both}
.kpi:nth-child(2){animation-delay:.08s}.kpi:nth-child(3){animation-delay:.16s}.kpi:nth-child(4){animation-delay:.24s}
.kpi small{font-size:11.5px;font-weight:700;letter-spacing:.03em}
.kpi b{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px}
.k1{background:#2F363D}.k2{background:#0F766E}.k3{background:#9A7B4F}.k4{background:#5F6B73}
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;transform-origin:left;animation:grow .8s ease .2s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.stack i{display:block;height:100%}
.c1{background:#0F766E}.c2{background:#9A7B4F}.c3{background:#5F6B73}.c4{background:#B9C2C8}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px;font-size:14px}
.leg div{display:flex;gap:8px;align-items:center}
.leg i{width:12px;height:12px;border-radius:3px;flex:none}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:8px;padding:12px 14px;font-size:15px;max-width:76ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.box h3{font-size:15px}
.box ul{margin:0;padding-left:18px;font-size:15px}
.fin{position:relative;overflow:hidden}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in both}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
/* dibujos */
.bobs{animation:bob 2.2s ease-in-out infinite}
.wig{transform-origin:50% 80%;animation:wig 1.8s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.bub{animation:bub 2.4s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.steam{animation:steam 2.2s ease-in-out infinite}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.snA{transform-origin:50px 50px;animation:snA .9s ease-in-out infinite}
.snB{transform-origin:50px 50px;animation:snB .9s ease-in-out infinite}
@keyframes snA{50%{transform:rotate(12deg)}}
@keyframes snB{50%{transform:rotate(-12deg)}}
.flick{transform-box:fill-box;transform-origin:center bottom;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.2,.85)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media (max-width:520px){.nav{flex-wrap:wrap}.btn{padding:12px 18px}.card{padding:14px}}
</style>
</head>

function I(v,r){return '<td class="in'+(r?' r':'')+'"><span style="--i:'+Math.min(ci++,45)+'">'+esc(v)+'</span></td>';}
function L(v){return '<td class="lb">'+esc(v)+'</td>';}
function grid(letters,head,rows,start){
  var h='<div class="xl"><table><thead><tr><th></th>'+letters.map(function(l){return '<th>'+l+'</th>';}).join('')+'</tr></thead><tbody>';
  if(head)h+='<tr class="hd"><td class="rn">'+(start-1)+'</td>'+head.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';
  rows.forEach(function(r,i){h+='<tr><td class="rn">'+(r.n||start+i)+'</td>'+r.c.join('')+'</tr>';});
  return h+'</tbody></table></div><div class="legend"><span class="sw"></span>Las celdas verde claro son las que escribes en tu Excel, en esa misma fila y columna</div>';
}
function say(who,txt){var N={sofia:'Sofía / Analista asistente de costos',mateo:'Mateo / Analista de costos',lucia:'Lucía / Asesora de negocios'};
  return '<div class="say"><img src="'+IMG[who]+'" alt=""><div><div class="who">'+N[who]+'</div><p>'+txt+'</p></div></div>';}
function steps(){
  var c=D[ex], r=R[ex], serv=c.tipo==='Servicios', P=c.ex_prod, n=P.length, cosa=serv?'servicio':'producto';
  var PC=['C','D','E','F','G'], MC=['K','L','M','N','O'], LC=['F','G','H','I','J'];
  var S=[];
  ci=0;
  S.push({tab:'Datos',where:'Celdas C3 y C7',stk:'gear',t:'Abre el Excel y dile qué negocio es',who:'sofia',
    say:'Hola, yo te acompaño a llenar la pestaña Datos. Vamos a copiar este ejemplo celda por celda para que veas cómo funciona. Después lo reemplazas con tus propios datos.',
    body:'<ol class="do"><li>Abre la plantilla y entra a la pestaña Datos</li><li>Borra el ejemplo que viene cargado: selecciona las celdas verde claro y presiona Suprimir</li><li>Escribe estas dos celdas</li></ol>'+
      grid(['B','C'],null,[{n:3,c:[L('Tipo de negocio'),I(c.tipo)]},{n:7,c:[L('Empresa'),I(c.empresa)]}],3)});
  ci=0;
  S.push({tab:'Datos',where:'Paso 1 / filas 8 a 19',stk:'gear',t:'Revisa los parámetros',who:'sofia',
    say:'Estos porcentajes ya vienen con los valores habituales en el Perú. Solo confirma estos cinco. El margen es cuánto quieres ganar por cada sol que vendes.',
    body:grid(['B','C'],null,[{n:8,c:[L('IGV'),I('18%',1)]},{n:16,c:[L('Tasa de impuesto a la renta'),I('29.5%',1)]},{n:17,c:[L('¿La mano de obra directa es costo variable?'),I('No')]},{n:18,c:[L('Base para repartir los costos indirectos'),I('Horas de MOD')]},{n:19,c:[L('Margen de utilidad que quieres ganar'),I('30%',1)]}],8)+
      '<p class="legend">Las filas 9 a 15 (EsSalud, gratificaciones, CTS, vacaciones, horas) se dejan como están</p>'});
  ci=0;
  var rowsP=['Nombre del '+cosa,'Unidad de venta','Precio de venta con IGV (S/)',serv?'No se llena en servicios':'Unidades que PRODUCES al mes','Unidades que VENDES al mes'].map(function(lb,j){
    return {c:[L(lb)].concat(P.map(function(p){var v=p[j]; if(j===3&&serv)return '<td class="off">vacía</td>'; return I(j===2?f2(v):(j>2?f0(v):v),j>=2);}))};});
  S.push({tab:'Datos',where:'Paso 2 / filas 23 a 27',stk:'tag',t:'Anota qué vendes',who:'sofia',
    say:(n>1?'Cada '+cosa+' va en su propia columna, empezando por la C. ':'Como es un solo '+cosa+', solo usas la columna C. ')+(serv?'En servicios no se guarda inventario, por eso la fila 26 queda vacía.':'Produces un poco más de lo que vendes porque siempre queda algo en stock.'),
    body:grid(PC.slice(0,n),['Dato'].concat(P.map(function(_,i){return (serv?'Servicio ':'Producto ')+(i+1);})).slice(0),rowsP,23).replace('<th></th>','<th></th><th>B</th>')});
  ci=0;
  var mh=['Material','Presentación','Contenido','Unidad de medida','Precio pagado (S/)','¿Incluye IGV?','Tipo','% de merma','Consumo del MES'].concat(P.map(function(p){return 'Cuánto lleva 1: '+p[0];}));
  var mr=c.ex_mat.map(function(m){return {c:[I(m[0]),I(m[1]),I(nv(m[2]),1),I(m[3]),I(f2(m[4]),1),I(m[5]),I(m[6]),I(pc(m[7]),1),I(nv(m[8]),1)].concat(P.map(function(_,i){return I(nv(m[9][i]),1);}))};});
  var m0=c.ex_mat[0];
  S.push({tab:'Datos',where:'Paso 3 / desde la fila 32',stk:'box',t:'Anota los materiales',who:'sofia',
    say:'Copia cada compra como aparece en tu boleta. Mira la primera fila: '+esc(m0[0])+' viene en '+esc(m0[1])+' y cuesta S/ '+f2(m0[4])+'. En las últimas columnas va lo que lleva UNA sola unidad vendida, en la misma unidad de medida ('+esc(m0[3])+'). Los materiales tipo MPI o gasto no llevan consumo por unidad, llevan consumo del mes en la columna J.',
    body:grid(['B','C','D','E','F','G','H','I','J'].concat(MC.slice(0,n)),mh,mr,32)+'<p class="legend">Desliza la tabla hacia la derecha para ver todas las columnas</p>'});
  ci=0;
  var ph=['Puesto','N.° de trabajadores','Tipo','Sueldo mensual (S/)'].concat(P.map(function(p){return 'Minutos para 1: '+p[0];}));
  var pr=c.ex_per.map(function(m){return {c:[I(m[0]),I(nv(m[1]),1),I(m[2]),I(f2(m[3]),1)].concat(P.map(function(_,i){return I(nv(m[4][i]),1);}))};});
  S.push({tab:'Datos',where:'Paso 4 / desde la fila 66',stk:'person',t:'Anota a tu personal',who:'sofia',
    say:'Escribe solo el sueldo. Los beneficios se suman solos. MOD es quien hace el trabajo directo y por eso lleva minutos por unidad. Los demás puestos no llevan minutos.',
    body:grid(['B','C','D','E'].concat(LC.slice(0,n)),ph,pr,66)});
  ci=0;
  S.push({tab:'Datos',where:'Paso 5 / desde la fila 85',stk:'factory',t:'Anota tus equipos',who:'sofia',
    say:'Las máquinas se desgastan. La plantilla reparte su valor entre los meses que van a durar. Por ejemplo, '+esc(c.ex_eq[0][0])+' cuesta S/ '+f0(c.ex_eq[0][1])+' y dura '+c.ex_eq[0][2]+' años, así que cada mes carga S/ '+f2(c.ex_eq[0][1]/c.ex_eq[0][2]/12)+' al costo.',
    body:grid(['B','C','D','E'],['Equipo','Valor sin IGV (S/)','Vida útil (años)','¿Dónde se usa?'],c.ex_eq.map(function(m){return {c:[I(m[0]),I(f2(m[1]),1),I(m[2],1),I(m[3])]};}),85)});
  ci=0;
  S.push({tab:'Datos',where:'Paso 6 / desde la fila 99',stk:'receipt',t:'Anota los otros pagos del mes',who:'sofia',
    say:'Aquí va lo que falta: alquiler, luz, publicidad. CIF es lo que pertenece al lugar donde se '+(serv?'atiende':'produce')+'. Fijo quiere decir que lo pagas igual aunque no vendas nada. Con esto terminaste de llenar.',
    body:grid(['B','C','D','E'],['Concepto','Monto del mes sin IGV (S/)','Tipo','¿Fijo o variable?'],c.ex_ot.map(function(m){return {c:[I(m[0]),I(f2(m[1]),1),I(m[2]),I(m[3])]};}),99)});
  var chk=[['Materia prima directa','mpd',150],['Mano de obra directa','mod',151],['Costos indirectos (CIF)','cif',152],['COSTO DE PRODUCCIÓN','cprod',153],['Gastos por unidad','gastos',157],['COSTO TOTAL POR UNIDAD','ctotal',158]];
  var ct='<div class="xl"><table><thead><tr><th></th><th>B</th>'+PC.slice(0,n).map(function(l){return '<th>'+l+'</th>';}).join('')+'</tr></thead><tbody><tr class="hd"><td class="rn">145</td><td>Concepto (S/ por unidad)</td>'+P.map(function(p){return '<td>'+esc(p[0])+'</td>';}).join('')+'</tr>'+
    chk.map(function(k){return '<tr><td class="rn">'+k[2]+'</td>'+L(k[0])+r.P.map(function(p){return '<td class="r">'+f2(p[k[1]])+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
  S.push({tab:'Costos',where:'Bloque E / filas 150 a 158',stk:'calc',t:'Comprueba que salió bien',who:'mateo',
    say:'Yo ya hice las cuentas. Pasa a la pestaña Costos y baja hasta el bloque E. Si copiaste todo igual, verás estos mismos números. Además, tu personal usa '+f0(r.E.horasNec)+' de las '+f0(r.E.horasDisp)+' horas que tiene disponibles al mes.',
    body:ct+'<div class="note">Si un número no coincide: la materia prima se revisa en el Paso 3, la mano de obra en el Paso 4 y los costos indirectos en los Pasos 5 y 6.</div>'});
  S.push({tab:'Dashboard',where:n>1?'Selectores en C4 y H4':'Selector en C4',stk:'chart',t:'Mira el resultado en el Dashboard',who:'lucia',dash:true});
  S.push({tab:'Listo',where:'',stk:'pie',t:'Listo, ya sabes usar la plantilla',who:'sofia',fin:true});
  return S;
}
function dash(){
  var c=D[ex], r=R[ex], p=r.P[sel], P=c.ex_prod, n=P.length, serv=c.tipo==='Servicios';
  var parts=[['Materia prima directa',p.mpd,'c1'],['Mano de obra directa',p.mod,'c2'],['Costos indirectos',p.cif,'c3'],['Gastos de ventas y administración',p.gastos,'c4']];
  var h='';
  if(n>1)h+='<div class="tabs" role="group" aria-label="Elegir">'+P.map(function(x,i){return '<button type="button" data-sel="'+i+'" aria-pressed="'+(i===sel)+'">'+esc(x[0])+'</button>';}).join('')+'</div>';
  h+='<div class="kpis"><div class="kpi k1"><small>COSTO TOTAL POR UNIDAD</small><b data-n="'+p.ctotal+'" data-d="2">'+f2(p.ctotal)+'</b><span>Soles</span></div>'+
     '<div class="kpi k2"><small>PRECIO ACTUAL CON IGV</small><b data-n="'+p.precio+'" data-d="2">'+f2(p.precio)+'</b><span>Sin IGV S/ '+f2(p.psin)+'</span></div>'+
     '<div class="kpi k3"><small>MARGEN DE UTILIDAD</small><b data-n="'+(p.margen*100)+'" data-d="1" data-s="%">'+(p.margen*100).toFixed(1)+'%</b><span>Ganas S/ '+f2(p.util)+' por unidad</span></div>'+
     '<div class="kpi k4"><small>PUNTO DE EQUILIBRIO</small><b data-n="'+p.pe+'" data-d="0">'+f0(p.pe)+'</b><span>Hoy se venden '+f0(p.ventas)+' al mes</span></div></div>';
  h+='<div class="box"><h3>En qué se va el costo de una unidad</h3><div class="stack">'+parts.map(function(x){return '<i class="'+x[2]+'" style="width:'+(100*x[1]/p.ctotal)+'%"></i>';}).join('')+'</div><div class="leg">'+
     parts.map(function(x){return '<div><i class="'+x[2]+'"></i>'+x[0]+'<b>S/ '+f2(x[1])+'</b></div>';}).join('')+'</div></div>';
  var dif=p.sug-p.precio, msg;
  if(p.util<0)msg='Se vende por debajo del costo. Se pierde S/ '+f2(-p.util)+' por unidad.';
  else if(dif>0)msg='El precio cubre el costo. Para ganar 30 % habría que cobrar S/ '+f2(p.sug)+', es decir S/ '+f2(dif)+' más.';
  else msg='El precio ya deja más del 30 % que se quería ganar. El precio mínimo para ese margen sería S/ '+f2(p.sug)+'.';
  var e=r.E, falta=e.ventasU-e.peU;
  h+='<div class="two"><div class="box"><h3>Precio</h3><p>'+msg+'</p></div><div class="box"><h3>Punto de equilibrio del negocio</h3><p>Hay que vender '+f0(e.peU)+' unidades al mes (S/ '+f0(e.peS)+' sin IGV) para no perder. Se venden '+f0(e.ventasU)+', o sea '+f0(Math.abs(falta))+(falta>=0?' por encima.':' por debajo.')+' La utilidad operativa del mes es S/ '+f0(e.utilOp)+'.</p></div></div>';
  return h;
}
function fin(){
  var cols=['#0F766E','#9A7B4F','#B4534A','#5F6B73','#F4C9B8'], cf='';
  for(var i=0;i<36;i++)cf+='<i style="left:'+(i*2.8+Math.random()*2)+'%;background:'+cols[i%5]+';animation-delay:'+(Math.random()*0.9).toFixed(2)+'s"></i>';
  return '<div class="conf">'+cf+'</div><div class="two"><div class="box"><h3>Ahora con tus datos</h3><ul><li>Borra las celdas verde claro del ejemplo</li><li>Repite los seis pasos con tus boletas, sueldos y recibos</li><li>Deja vacías las filas que no uses</li></ul></div>'+
    '<div class="box"><h3>Para sacarle más provecho</h3><ul><li>En el Dashboard, escribe otro precio en el simulador y mira cómo cambia tu ganancia</li><li>Si tienes varios, compáralos con los selectores A y B</li><li>La pestaña Flujo muestra el mapa completo del cálculo</li></ul></div>'+
    '<div class="box"><h3>Cuida estos detalles</h3><ul><li>Los porcentajes se escriben con el signo, por ejemplo 2%</li><li>El consumo va en la misma unidad de medida del material</li><li>No escribas sobre celdas que no sean verde claro</li></ul></div></div>';
}
function countUp(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  [].forEach.call(app.querySelectorAll('[data-n]'),function(el){
    var to=parseFloat(el.getAttribute('data-n')),d=parseInt(el.getAttribute('data-d'),10),s=el.getAttribute('data-s')||'',t0=null;
    function tick(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/700),v=to*(1-Math.pow(1-k,3));
      el.textContent=v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+s;if(k<1)requestAnimationFrame(tick);}
    requestAnimationFrame(tick);});
}
function save(){try{localStorage.setItem('guia-wiz',JSON.stringify({ex:ex,step:step}));}catch(e){}}
function render(){
  var exn=document.getElementById('exname'),chg=document.getElementById('change'),bar=document.getElementById('bar');
  if(!ex){
    exn.hidden=true;chg.hidden=true;bar.style.width='0';
    app.innerHTML='<div class="stage"><div class="intro"><h2>Aprende a llenar la plantilla con un ejemplo</h2><p>Elige el caso que más se parece a tu negocio. Te llevaré paso a paso, con botón Siguiente, mostrando qué escribir en cada celda del Excel. Ten la plantilla abierta al lado.</p></div>'+
      '<div class="choices">'+EXS.map(function(x){return '<button type="button" class="choice'+(x.art.length>1?' many':'')+'" data-ex="'+x.id+'"><div class="art">'+x.art.map(function(a){return ART[a];}).join('')+'</div><em>'+x.k+'</em><b>'+x.t+'</b><span>'+x.d+'</span></button>';}).join('')+'</div></div>';
    return;
  }
  var S=steps(),s=S[step],info=EXS.filter(function(x){return x.id===ex;})[0];
  exn.hidden=false;chg.hidden=false;exn.textContent=info.t+' / '+D[ex].empresa;
  bar.style.width=(100*(step+1)/S.length)+'%';
  var body=s.dash?dash():(s.fin?fin():s.body);
  var txt=s.dash?'Esta es la pestaña para decidir. '+(D[ex].ex_prod.length>1?'Toca cada nombre para ver sus números. En el Excel se eligen en las celdas C4 y H4.':'En el Excel verás estas mismas tarjetas arriba de todo.')+' La franja más ancha de la barra es donde más conviene buscar ahorros.':
          (s.fin?'Llenaste los seis pasos, comprobaste los costos y leíste el Dashboard. Ese es todo el recorrido. Ahora te toca hacerlo con los datos de tu negocio.':s.say);
  app.innerHTML='<div class="stage'+(dir<0?' back':'')+'"><div class="card'+(s.fin?' fin':'')+'"><div class="shead"><img src="'+IMG[s.stk]+'" alt=""><div><small>PASO '+(step+1)+' DE '+S.length+'</small><h2>'+s.t+'</h2></div></div>'+
    (s.where?'<div class="where"><span class="tag">Pestaña '+s.tab+'</span><span class="tag">'+s.where+'</span></div>':'')+say(s.who,txt)+body+
    '<div class="nav"><button type="button" class="btn prev" id="prev">'+(step===0?'Elegir otro ejemplo':'Anterior')+'</button><span class="count">'+(step+1)+' / '+S.length+'</span>'+
    (step<S.length-1?'<button type="button" class="btn next" id="next">Siguiente</button>':'<button type="button" class="btn next" id="again">Probar otro ejemplo</button>')+'</div></div></div>';
  if(s.dash)countUp();
  window.scrollTo(0,0);
}
app.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.ex){ex=b.dataset.ex;step=0;sel=0;dir=1;}
  else if(b.id==='next'){step++;dir=1;}
  else if(b.id==='prev'){if(step===0)ex=null;else{step--;dir=-1;}}
  else if(b.id==='again'){ex=null;step=0;}
  else if(b.dataset.sel!==undefined){sel=parseInt(b.dataset.sel,10);dir=1;}
  else return;
  save();render();
});
document.getElementById('change').addEventListener('click',function(){ex=null;step=0;save();render();});
document.addEventListener('keydown',function(ev){if(!ex)return;var n=document.getElementById('next'),p=document.getElementById('prev');
  if(ev.key==='ArrowRight'&&n)n.click();if(ev.key==='ArrowLeft'&&p&&step>0)p.click();});
try{var st=JSON.parse(localStorage.getItem('guia-wiz')||'null');if(st&&D[st.ex]){ex=st.ex;step=Math.min(st.step||0,9);}}catch(e){}
render();
</script>
</body>
</html>
