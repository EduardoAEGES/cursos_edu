<style>

html,body{width:1600px;height:400px;overflow:hidden;background:#071767}
body{font-family:"Inter Display","Inter",sans-serif;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 60% 120% at 78% 50%,#2a55d8 0%,rgba(42,85,216,0) 70%),

.p2{right:150px;height:360px}

.ic img{width:50px;height:50px;object-fit:contain}
.i1{left:975px;top:105px;width:70px;height:70px}.i2{right:62px;top:160px;width:70px;height:70px}.i3{left:1105px;top:40px;width:66px;height:66px}.i4{left:735px;top:200px;width:64px;height:64px}
