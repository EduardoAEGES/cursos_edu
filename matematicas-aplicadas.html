<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matemáticas Aplicadas / Pensamiento Lógico</title>
<style>
  :root{
    --bg:#0f172a; --bg-soft:#1e293b; --accent:#38bdf8; --accent-2:#f472b6;
    --text:#e2e8f0; --text-dim:#94a3b8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(circle at top,#1e293b,#0f172a 60%); color:var(--text);
  }
  header{ text-align:center; padding:52px 20px 12px; }
  header .emoji{ font-size:46px; }
  header h1{
    margin:10px 0 6px; font-size:clamp(26px,4.5vw,40px);
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{ color:var(--text-dim); margin:0; font-size:15px; }
  .back{ display:inline-block; margin-top:14px; color:var(--accent); text-decoration:none; font-size:14px; }
  .back:hover{ text-decoration:underline; }
  main{ max-width:760px; margin:0 auto; padding:24px 20px 80px; }
  h2{ font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin:10px 0 16px; }
  .empty{
    background:var(--bg-soft); border:1px dashed rgba(255,255,255,.15); border-radius:14px;
    padding:32px 20px; text-align:center; color:var(--text-dim);
  }
</style>
</head>
<body>

<header>
  <div class="emoji">📐</div>
  <h1>Matemáticas Aplicadas / Pensamiento Lógico</h1>
  <p>Repositorio de recursos de Eduardo</p>
  <div><a class="back" href="index.html">← Volver al repositorio</a></div>
</header>

<main>
  <h2>Sesiones</h2>
  <div class="empty">Aún no hay sesiones publicadas. Pronto se agregará contenido.</div>
</main>

</body>
</html>
