<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistemas de Procesos Contables</title>
<style>
  :root{
    --bg:#0f172a; --bg-soft:#1e293b; --accent:#38bdf8; --accent-2:#f472b6;
    --text:#e2e8f0; --text-dim:#94a3b8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(circle at top,#1e293b,#0f172a 60%); color:var(--text);
  }
  header{ text-align:center; padding:52px 20px 12px; }
  header .emoji{ font-size:46px; }
  header h1{
    margin:10px 0 6px; font-size:clamp(26px,4.5vw,40px);
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{ color:var(--text-dim); margin:0; font-size:15px; }
  .back{
    display:inline-block; padding:11px 22px; border-radius:999px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#0f172a; font-weight:700; font-size:14px; letter-spacing:.01em;
    text-decoration:none; border:none; cursor:pointer;
    box-shadow:0 6px 16px rgba(56,189,248,.18);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .back:hover{ transform:translateY(-2px); filter:brightness(1.06); box-shadow:0 10px 22px rgba(56,189,248,.28); }
  .back:active{ transform:translateY(0); }
  .back-top{ margin-top:18px; }
  .back-bottom{ margin:40px 0 0; text-align:center; }
  main{ max-width:760px; margin:0 auto; padding:24px 20px 80px; }
  h2{ font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin:10px 0 16px; }
  .sessions{ display:grid; gap:14px; }
  .session{
    display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--text);
    background:var(--bg-soft); border:1px solid rgba(255,255,255,.08); border-radius:14px;
    padding:18px 20px; transition:transform .15s ease, border-color .15s ease;
  }
  .session:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .session .num{
    flex:none; width:52px; height:52px; border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#0f172a;
  }
  .session .info{ flex:1; }
  .session .info .t{ font-weight:700; font-size:17px; }
  .session .info .d{ color:var(--text-dim); font-size:13px; margin-top:2px; }
  .session .chev{ color:var(--text-dim); font-size:22px; }
</style>
</head>
<body>

<header>
  <div class="emoji">🧾</div>
  <h1>Sistemas de Procesos Contables</h1>
  <p>Registro de operaciones en sistema contable · 2026</p>
  <div class="back-top"><a class="back" href="index.html">Volver al repositorio</a></div>
</header>

<main>
  <h2>Casos</h2>
  <div class="sessions">
    <a class="session" href="caso-2-gorriones.html">
      <div class="num">2</div>
      <div class="info">
        <div class="t">Caso N.° 2 — Los Gorriones S.A.</div>
        <div class="d">Resolución paso a paso en video · febrero 2026</div>
      </div>
      <div class="chev">›</div>
    </a>
  </div>
  <div class="back-bottom"><a class="back" href="index.html">Volver al repositorio</a></div>
</main>

</body>
</html>
