<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semana 13 · Estudio de producto 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1f;--ink:#eef1fb;--mut:#9aa6c7;--a:#2dd4bf;--b:#fbbf24;--c:#fb7185;--d:#60a5fa;--e:#a78bfa;--g:#64748b;--glass:rgba(16,23,48,.78);--line:rgba(255,255,255,.10);--rx:20deg;--ry:-28deg}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 700px at 62% 28%,#1c2a5c 0%,#0e1530 45%,#070b18 100%);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#vp{position:fixed;inset:0;perspective:1700px;perspective-origin:50% 30%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:var(--cx,50%);top:var(--cy,60%);width:0;height:0;transform-style:preserve-3d}
.layer,.pos,.grow,.cub,.pop{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.fc{position:absolute;background:var(--c);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc.t{background:color-mix(in srgb,var(--c) 72%,white)}
.fc.r,.fc.l{background:color-mix(in srgb,var(--c) 68%,black)}
.fc.b{background:color-mix(in srgb,var(--c) 78%,black)}
.fc.u{background:color-mix(in srgb,var(--c) 35%,black)}
.fc.f{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,white),var(--c))}
.fc.f .ft{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font:700 13px/1.15 'Sora',sans-serif;color:#0b1020}
/* animations */
.grow{transform:scaleY(.001);transition:transform .9s steps(7,end)}
.layer.on .grow{transform:scaleY(1)}
.layer.out .grow{transform:scaleY(.001);transition-duration:.35s;transition-delay:0s!important}
.pop{transform:scale3d(.001,.001,.001);transition:transform .6s steps(5,end)}
.layer.on .pop{transform:none}
.layer.out .pop{transform:scale3d(.001,.001,.001);transition-duration:.35s;transition-delay:0s!important}
.fade{opacity:0;transition:opacity .5s steps(4,end)}
.layer.on .fade{opacity:1}
.layer.out .fade{opacity:0;transition-duration:.3s;transition-delay:0s!important}
/* billboard */
.bb{position:absolute;left:0;top:0;transform:translate3d(var(--x),var(--y),var(--z)) rotateY(calc(var(--ry) * -1)) rotateX(calc(var(--rx) * -1)) translate(-50%,-50%);white-space:nowrap;pointer-events:none}
.bb.anchor-b{transform:translate3d(var(--x),var(--y),var(--z)) rotateY(calc(var(--ry) * -1)) rotateX(calc(var(--rx) * -1)) translate(-50%,-100%)}
.lbl{font:600 15px/1.2 'Inter',sans-serif;color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.lbl.sm{font-size:12.5px;color:#c9d2ee;font-weight:500}
.lbl.val{font:800 20px/1 'Sora',sans-serif}
.lbl.big{font:800 40px/1 'Sora',sans-serif;letter-spacing:-.02em}
.lbl.huge{font:800 64px/1 'Sora',sans-serif;letter-spacing:-.03em}
.lbl.pill{background:var(--glass);border:1px solid var(--line);padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.board{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;white-space:normal;box-shadow:0 18px 50px rgba(0,0,0,.45);font:500 14px/1.45 'Inter',sans-serif;color:var(--ink)}
.board h4{margin:0 0 6px;font:700 15px/1.2 'Sora',sans-serif}
.board .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:4px}
.board ul{margin:4px 0 0;padding-left:18px}
.board li{margin:2px 0}
/* floor */
.tile{position:absolute;left:0;top:0;transform-style:preserve-3d}
.tile>div{position:absolute;transform:translate(-50%,-50%)}
#floor{position:absolute;left:0;top:0;transform:rotateX(90deg)}
#floor>div{position:absolute;width:1700px;height:1300px;transform:translate(-50%,-50%);background-image:linear-gradient(rgba(140,170,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,255,.10) 1px,transparent 1px);background-size:50px 50px;-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%)}
.plane{position:absolute;transform:translate(-50%,-50%);border:1.5px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.06)}
/* person */
.pp{width:22px;height:40px}
.pp i{position:absolute;left:5px;top:0;width:12px;height:12px;border-radius:50%;background:var(--pc)}
.pp b{position:absolute;left:1px;top:14px;width:20px;height:24px;border-radius:10px 10px 4px 4px;background:var(--pc);filter:brightness(.82)}
/* UI */
header{position:fixed;left:0;right:0;top:0;padding:16px 22px;display:flex;align-items:center;gap:14px;pointer-events:none;z-index:5}
header .kick{font:700 11px/1 'Inter';letter-spacing:.14em;text-transform:uppercase;color:var(--a);background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.35);padding:7px 10px;border-radius:999px}
header h1{margin:0;font:800 clamp(18px,2.2vw,26px)/1.1 'Sora',sans-serif;letter-spacing:-.01em}
header .sub{color:var(--mut);font-size:13px;margin-top:3px}
#panel{position:fixed;left:22px;bottom:22px;width:min(420px,calc(100vw - 44px));max-height:calc(100vh - 120px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px 20px 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.45);z-index:6}
#panel .meta{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#panel .num{font:800 12px/1 'Sora';color:#0b1020;background:var(--a);padding:6px 9px;border-radius:8px}
#panel .day{font:700 11px/1 'Inter';letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:8px;border:1px solid var(--line);color:var(--mut)}
#panel .day.M{color:var(--d);border-color:rgba(96,165,250,.4)}
#panel .day.X{color:var(--e);border-color:rgba(167,139,250,.45)}
#panel h2{margin:4px 0 6px;font:800 21px/1.2 'Sora',sans-serif;letter-spacing:-.01em}
#panel .lead{color:#d6dcf2;font-size:14.5px;line-height:1.5;margin:0 0 10px}
#panel .body{font-size:14px;line-height:1.55;color:#cfd6ee}
#panel .body p{margin:0 0 8px}
#panel .body ul,#panel .body ol{margin:0 0 8px;padding-left:20px}
#panel .body li{margin:3px 0}
#panel .f{background:rgba(0,0,0,.28);border:1px solid var(--line);border-left:3px solid var(--b);border-radius:10px;padding:9px 12px;margin:8px 0;font:600 14px/1.5 'JetBrains Mono',ui-monospace,monospace;color:#fde68a;overflow-x:auto}
#panel .tip{background:rgba(45,212,191,.09);border:1px solid rgba(45,212,191,.3);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13.5px}
#panel .tip b{color:var(--a)}
#panel table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 8px}
#panel th,#panel td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right}
#panel th:first-child,#panel td:first-child{text-align:left}
#panel th{color:var(--mut);font-weight:600}
#panel code{word-break:break-all;font-family:'JetBrains Mono',monospace;font-size:12.5px;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.hl-a{color:var(--a);font-weight:700}.hl-b{color:var(--b);font-weight:700}.hl-c{color:var(--c);font-weight:700}.hl-d{color:var(--d);font-weight:700}.hl-e{color:var(--e);font-weight:700}
#nav{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
#nav button{font:700 13px 'Inter';color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
#nav button:hover{background:rgba(255,255,255,.14)}
#nav button.pri{background:var(--a);color:#06201c;border-color:transparent}
#nav button:disabled{opacity:.35;cursor:default}
#dots{display:flex;gap:5px;flex-wrap:wrap;flex:1;justify-content:center}
#dots button{width:8px;height:8px;cursor:pointer;padding:0;border-radius:50%;border:none;background:rgba(255,255,255,.22)}
#dots button.M{box-shadow:inset 0 0 0 1.5px rgba(96,165,250,.6)}
#dots button.X{box-shadow:inset 0 0 0 1.5px rgba(167,139,250,.7)}
#dots button.cur{background:var(--a);transform:scale(1.25)}
#dots button.done{background:rgba(45,212,191,.45)}
#hint{position:fixed;right:22px;bottom:22px;color:var(--mut);font-size:12.5px;text-align:right;line-height:1.6;z-index:4;pointer-events:none}
#hint kbd{font:600 11px 'Inter';border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink)}
#back{position:fixed;right:22px;top:20px;z-index:7;color:var(--mut);font-size:13px;text-decoration:none;border:1px solid var(--line);padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.2)}
#back:hover{color:var(--ink)}
#prog{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--a),var(--d));z-index:8;transition:width .5s}
#legend{position:fixed;right:22px;top:64px;z-index:4;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#legend span{font-size:12.5px;color:#cfd6ee;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.25);padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
#legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:860px){
 header{padding:12px 120px 12px 14px}header .kick,header .sub{display:none}header h1{font-size:17px}
 #back{top:12px;right:12px;font-size:12px}
 #panel{left:10px;right:10px;bottom:10px;width:auto;max-height:46vh;padding:14px 15px 12px;border-radius:16px}
 #panel h2{font-size:18px}#panel .lead{font-size:13.5px}#panel .body{font-size:13.5px}
 #hint{display:none}#legend{display:none}
}

/* ===== stop-motion characters ===== */
.gmk{width:1px;height:100px;pointer-events:none}
#ov{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.ovl{position:absolute;left:0;top:0}
.guy{position:absolute;left:0;top:0;width:260px;height:190px;transform-origin:130px 190px;pointer-events:none}
.guy.ia .gf{pointer-events:auto;cursor:pointer}
.guy .gf{position:absolute;left:115px;bottom:0;width:30px;height:66px;transform-origin:50% 100%}
.guy .gy,.guy .gb{position:absolute;inset:0;transform-origin:50% 100%}
.guy .gy{animation:boil .44s steps(1) infinite}
.guy.flip .gb>.fl{transform:scaleX(-1)}
.guy .fl{position:absolute;inset:0;transform-origin:50% 50%}
.guy span{position:absolute;display:block}
.guy .head{left:6px;top:0;width:18px;height:18px;border-radius:50%;background:var(--sk);z-index:3}
.guy .hair{position:absolute;left:-1px;top:-2px;width:20px;height:9px;border-radius:10px 10px 3px 3px;background:var(--hr)}
.guy .eye{position:absolute;top:8px;width:2.6px;height:3.2px;border-radius:2px;background:#1e1b2e}
.guy .eye.l{left:5px}.guy .eye.r{left:11px}
.guy .mouth{position:absolute;left:6px;top:12.5px;width:6px;height:2.6px;border-radius:0 0 4px 4px;background:#7c2d12}
.guy .torso{left:5px;top:18px;width:20px;height:25px;border-radius:8px 8px 4px 4px;background:var(--sh);z-index:2;font:800 10px/25px 'Sora',sans-serif;color:#0b1020;text-align:center}
.guy .arm{top:20px;width:5px;height:20px;border-radius:3px;background:color-mix(in srgb,var(--sh) 80%,black);transform-origin:50% 2px;z-index:1}
.guy .arm::after{content:'';position:absolute;bottom:-3px;left:0;width:5px;height:5px;border-radius:50%;background:var(--sk)}
.guy .arm.l{left:2px}.guy .arm.r{left:23px}
.guy .leg{top:41px;width:7px;height:23px;border-radius:3px;background:var(--pt);transform-origin:50% 2px}
.guy .leg::after{content:'';position:absolute;bottom:-2px;left:-1px;width:10px;height:4px;border-radius:3px;background:#0b1020}
.guy .leg.l{left:8px}.guy .leg.r{left:15px}
.guy .shadow{left:1px;top:62px;width:28px;height:6px;border-radius:50%;background:rgba(0,0,0,.35);z-index:0}
.guy.walk .leg.l,.guy.walk .arm.r{animation:swA .34s steps(1) infinite}
.guy.walk .leg.r,.guy.walk .arm.l{animation:swB .34s steps(1) infinite}
.guy.walk .gb{animation:bob .34s steps(1) infinite}
.guy.wave .arm.r{animation:wave .5s steps(1) infinite}
.guy.cheer .arm.l{animation:chL .4s steps(1) infinite}.guy.cheer .arm.r{animation:chR .4s steps(1) infinite}
.guy.cheer .gb{animation:jump .4s steps(1) infinite}
.guy.think .arm.r{transform:rotate(-160deg)}.guy.think .eye{top:6px}
.guy.point .arm.r{transform:rotate(-95deg)}
.guy.talk .mouth,.guy.wave .mouth,.guy.cheer .mouth{animation:talk .28s steps(1) infinite}
.guy.sad .mouth{border-radius:4px 4px 0 0;top:13px}
.guy.sad .gb{transform:translateY(2px)}
.guy.hold .arm.l{transform:rotate(-30deg)}.guy.hold .arm.r{transform:rotate(30deg)}
@keyframes boil{0%{transform:rotate(-1deg)}25%{transform:translate(.6px,-.5px) rotate(.7deg)}50%{transform:rotate(.9deg)}75%{transform:translate(-.6px,0) rotate(-.5deg)}}
@keyframes swA{0%{transform:rotate(30deg)}50%{transform:rotate(-30deg)}}
@keyframes swB{0%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wave{0%{transform:rotate(-155deg)}50%{transform:rotate(-115deg)}}
@keyframes chL{0%{transform:rotate(150deg)}50%{transform:rotate(125deg)}}
@keyframes chR{0%{transform:rotate(-150deg)}50%{transform:rotate(-125deg)}}
@keyframes jump{0%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes talk{0%{height:2.6px}50%{height:5px}}
.guy .bub{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) scale(.2);transform-origin:50% 100%;background:#fff;color:#0f172a;font:700 12.5px/1.25 'Inter',sans-serif;padding:6px 10px;border-radius:12px;white-space:nowrap;opacity:0;transition:opacity .15s steps(2),transform .24s steps(3,end);box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:5}
.guy .bub::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.guy .bub.on{opacity:1;transform:translateX(-50%) scale(1)}
.guy .bub.th{border-radius:16px;font-style:italic;color:#334155}
.guy.ia:hover .torso{outline:2px solid #fff;outline-offset:1px}
.bb.click{pointer-events:auto;cursor:pointer}
/* interactive panel */
#ia:empty{display:none}
#ia{margin:10px 0 4px;padding:12px;border-radius:12px;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.3)}
#ia .ttl{font:800 12px/1 'Inter';letter-spacing:.1em;text-transform:uppercase;color:var(--d);margin-bottom:8px}
#ia .row{display:grid;grid-template-columns:118px 1fr 48px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
#ia input[type=range]{width:100%;accent-color:var(--a)}
#ia output{font:700 13px 'JetBrains Mono',monospace;text-align:right;color:#fde68a}
#ia .res{margin-top:8px;font-size:14px;line-height:1.5}
#ia .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#ia button,.qz button{font:600 13px 'Inter';color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}
#ia button:hover,.qz button:hover{background:rgba(255,255,255,.16)}
#ia button.on{background:var(--a);color:#06201c}
#quiz:empty{display:none}
.qz{margin:10px 0 4px;padding:12px;border-radius:12px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.35)}
.qz .ttl{font:800 12px/1 'Inter';letter-spacing:.1em;text-transform:uppercase;color:var(--b);margin-bottom:8px}
.qz .q{font-weight:600;margin-bottom:8px;font-size:14px}
.qz .ops{display:flex;flex-direction:column;gap:6px}
.qz .ops button{text-align:left}
.qz button.ok{background:rgba(45,212,191,.25);border-color:var(--a)}
.qz button.no{background:rgba(251,113,133,.22);border-color:var(--c)}
.qz .fb{margin-top:8px;font-size:13.5px;line-height:1.5}
#score{font:700 11px/1 'Inter';letter-spacing:.06em;padding:6px 9px;border-radius:8px;background:rgba(251,191,36,.14);color:var(--b);border:1px solid rgba(251,191,36,.35)}
.click{pointer-events:auto!important;cursor:pointer}

</style>
</head>
<body>
<div id="prog"></div>
<div id="vp"><div id="world"><div id="floor"><div></div></div></div></div>
<div id="ov"></div>
<header><div><span class="kick" id="kick"></span></div><div><h1 id="title"></h1><div class="sub" id="sub"></div></div></header>
<a id="back" href="#">← Volver al curso</a>
<div id="legend"></div>
<section id="panel" aria-live="polite">
  <div class="meta"><span class="num" id="num"></span><span class="day" id="day"></span><span id="score"></span></div>
  <h2 id="h"></h2>
  <p class="lead" id="lead"></p>
  <div class="body" id="body"></div>
  <div id="ia"></div>
  <div id="quiz"></div>
  <div id="nav"><button id="prev">◀ Anterior</button><div id="dots"></div><button id="next" class="pri">Siguiente ▶</button></div>
</section>
<div id="hint">Clic en la escena, <kbd>→</kbd> o <kbd>espacio</kbd>: avanzar · <kbd>←</kbd>: retroceder<br>Haz clic en las personas · arrastra para girar · rueda: zoom</div>
<script>
(function(){
const fx = v => v.toFixed(1).replace('.',',');
const pct = v => Math.round(v)+'%';
const SC = ['Definitivamente sí','Probablemente sí','Puede que sí / no','Probablemente no','Definitivamente no'];
const SAY = ['¡Definitivamente lo compraría!','Probablemente lo compraría','Mmm… puede que sí, puede que no','Probablemente no','¡Definitivamente no!'];
const SCOL = ['a','a','g','c','c'];
window.COURSE = {
kicker: 'Investigación Cuantitativa · Semana 13',
title: 'Estudio de producto paso a paso',
sub: 'Prueba de concepto, prueba de producto, T2B y comparación de medias · caso Quinua Fresh',
back: 'investigacion-cuantitativa.html',
steps: [
{ t:'¿Qué fórmula lanzamos?', dayt:'Caso Quinua Fresh', cam:[18,-20,1.05],
  s:'Quinua Fresh tiene dos fórmulas de su nuevo producto: <b class="hl-b">A</b> y <b class="hl-d">B</b>. La gerente quiere lanzar una, pero el analista pide datos antes de decidir.',
  html:`<ul><li><b class="hl-d">Martes:</b> prueba de concepto y de producto, intención de compra y <b>Top Two Boxes (T2B)</b>.</li>
  <li><b class="hl-e">Miércoles:</b> comparación de medias, prueba t, producto ganador y mejoras.</li></ul>
  <div class="tip"><b>Cómo usar:</b> pulsa <i>Empezar</i> o →. <b>Haz clic en las personas</b> para escucharlas, usa los controles azules para mover los datos y resuelve el ★ reto de cada paso.</div>
  <p style="color:var(--mut);font-size:12.5px">Datos ilustrativos, para practicar el procedimiento.</p>`,
  build(W){
    W.block(-170,15,-40,160,30,160,'#334155'); W.block(170,15,-40,160,30,160,'#334155');
    W.block(-170,100,-40,86,140,54,'b',{text:'Quinua<br>Fresh<br><span style="font-size:22px">A</span>'});
    W.block(170,100,-40,86,140,54,'d',{text:'Quinua<br>Fresh<br><span style="font-size:22px">B</span>'});
    const lines1=['¿Lanzamos A o B?','¡El lanzamiento es en marzo!','Quiero una decisión con datos'];
    const lines2=['Hagamos un estudio de producto','Primero probemos el concepto','Luego comparamos A y B con una prueba t'];
    let k1=0,k2=0;
    W.guy(-50,110,{i:3,c:'e',s:1.4,from:[-380,170],act:'talk',say:'¿Lanzamos A o B?',sayFor:2000,click:g=>g.act('talk').say(lines1[++k1%3],2500)});
    W.guy(50,110,{i:8,c:'a',s:1.4,from:[380,170],faceEnd:-1,act:'think',say:'Necesito datos… 📊',think:true,delay:1900,click:g=>g.act('point').say(lines2[++k2%3],2500)});
    W.label(0,270,-40,'¿Cuál lanzamos?','big');
  }},

{ t:'Concepto vs. producto', day:'M', dayt:'Prueba de concepto y de producto', cam:[24,-16,1.05],
  s:'Son dos pruebas distintas, en momentos distintos. Mira a cada consumidor: uno solo <b>lee la idea</b>, el otro <b>prueba el producto</b>.',

{ t:'Escala de intención de compra', day:'M', dayt:'Prueba de concepto', cam:[22,-18,1],
  s:'Tras leer la tarjeta, cada persona responde: “¿Qué tan probable es que compres este producto?” Encuestamos a <b>n = 200</b>. Cada muñequito representa a 10 personas. <b>Haz clic en ellos.</b>',
  html:`<table><tr><th>Respuesta</th><th>Casos</th><th>%</th></tr>
  <tr><td>5 · Definitivamente sí</td><td>60</td><td>30%</td></tr><tr><td>4 · Probablemente sí</td><td>50</td><td>25%</td></tr>
  <tr><td>3 · Puede que sí / no</td><td>40</td><td>20%</td></tr><tr><td>2 · Probablemente no</td><td>30</td><td>15%</td></tr><tr><td>1 · Definitivamente no</td><td>20</td><td>10%</td></tr></table>
  <div class="f">% = casos ÷ n × 100 → 60 ÷ 200 × 100 = 30%</div>`,
  quiz:{q:'Si 30 de 200 personas responden “Probablemente no”, ¿qué porcentaje es?',o:['30%','15%','6,7%','20%'],a:1,fb:'30 ÷ 200 × 100 = 15%.'},
  build(W){
    const V=[60,50,40,30,20], gap=125;
    V.forEach((v,i)=>W.bar(-250+i*gap,-90,v*2.6,'d',{w:62,d:62,val:String(v),cat:SC[i],catOff:250}));
    W.step=35;
    V.forEach((v,i)=>{ const n=v/10;
      for(let k=0;k<n;k++){ const r=Math.floor(k/2), c=k%2;
        W.guy(-250+i*gap+(c-.5)*34, -10+r*34, {i:i*10+k, c:SCOL[i], from:[-250+i*gap+(Math.random()-.5)*200, 330], click:g=>g.act(i<2?'cheer':i>2?'sad':'think').say(SAY[i],2200)}); } });

{ t:'Top Two Boxes (T2B) en vivo', day:'M', dayt:'Indicador T2B', cam:[16,-18,1],
  s:'El T2B suma los dos casilleros más favorables. <b>Mueve los controles</b> y mira cómo cambian las barras y la reacción de la gerente.',
  html:`<div class="f">T2B = % (5) + % (4) = 30% + 25% = <span class="hl-a">55%</span></div>
  <div class="f" style="border-left-color:var(--c);color:#fecdd3">B2B = % (2) + % (1) = 15% + 10% = 25%</div>
  <div class="tip"><b>En Excel:</b> <code>=(CONTAR.SI(B2:B201;5)+CONTAR.SI(B2:B201;4))/CONTARA(B2:B201)</code></div>`,
  legend:[['a','Top Two Boxes'],['c','Bottom Two Boxes'],['g','Neutral']],
  quiz:{q:'De 200 personas, 70 eligen “Definitivamente sí” y 40 “Probablemente sí”. ¿Cuál es el T2B?',o:['35%','55%','110%','20%'],a:1,fb:'(70 + 40) ÷ 200 = 110 ÷ 200 = 55%.'},
  build(W){
    const V=[60,50,40,30,20];
    const B = V.map((v,i)=>W.bar(-300+i*125,0,v/200*100*6,SCOL[i],{w:62,d:62,val:pct(v/2),cat:SC[i]}));
    const t2 = W.label(-237,280,0,'T2B = 55%','big',{color:'a',delay:1000});
    const boss = W.guy(-30,140,{i:3,c:'e',s:1.3,from:[-420,220],act:'cheer',say:'¡Más de la mitad lo compraría!',sayFor:2500,delay:600});
    return {V,B,t2,boss};
  },
  ui(U,R){
    U.title('Laboratorio · cambia los casos');
    const res = U.out();
    const upd = ()=>{ const n = R.V.reduce((a,b)=>a+b,0)||1; const p = R.V.map(v=>v/n*100);
      R.B.forEach((b,i)=>b.set(p[i]*6,{val:pct(p[i])})); const t = p[0]+p[1], bb = p[3]+p[4];
      R.t2.innerHTML = 'T2B = '+pct(t);
      res.innerHTML = `n = <b>${n}</b> · T2B = <b class="hl-a">${pct(t)}</b> · B2B = <b class="hl-c">${pct(bb)}</b>`;
      if (t>=50) R.boss.act('cheer').say('¡T2B de '+pct(t)+'! El concepto avanza',2200); else R.boss.act('sad').say('T2B de '+pct(t)+'… hay que mejorar el concepto',2200);
    };
    SC.forEach((c,i)=>U.slider(`${5-i} · ${c}`,0,120,5,R.V[i],v=>{R.V[i]=v; upd();}));
    res.innerHTML = 'n = <b>200</b> · T2B = <b class="hl-a">55%</b> · B2B = <b class="hl-c">25%</b>';
  }},

{ t:'T2B por atributo y norma de acción', day:'M', dayt:'Prueba de producto', cam:[18,-22,1],

{ t:'Diseñar la prueba de producto', day:'X', dayt:'Prueba de producto', cam:[30,-14,1.1],
  s:'Observa a los consumidores: en la <b class="hl-d">monádica</b> cada grupo prueba un solo producto; en la <b class="hl-a">secuencial monádica</b> todos prueban A y luego B (en orden rotado).',
  html:`<ul><li><b class="hl-d">Monádica:</b> grupos independientes. Más parecida a la vida real.</li>
  <li><b class="hl-a">Secuencial monádica:</b> cada persona califica ambos por separado. Se <b>rota el orden</b> (mitad A→B, mitad B→A) para evitar el sesgo de orden. Necesita menos personas.</li></ul>
  <div class="tip"><b>Clave:</b> misma escala y mismas preguntas para A y B; si no, no se pueden comparar.</div>`,
  quiz:{q:'Cada persona prueba A y luego B, y a la mitad se le invierte el orden. ¿Qué diseño es?',o:['Monádica','Secuencial monádica','Prueba de concepto','Pareada sin rotación'],a:1,fb:'Todos prueban ambos productos, uno tras otro, rotando el orden.'},
  build(W){
    W.block(-300,40,-110,52,80,34,'b',{text:'A'}); W.block(-150,40,-110,52,80,34,'d',{text:'B'});
    W.block(140,40,-110,52,80,34,'b',{text:'A'}); W.block(260,40,-110,52,80,34,'d',{text:'B'});
    W.crowd(-300,30,6,'b',{cols:3,sp:34,from:[-300,320],step:60,act:'hold'});
    W.crowd(-150,30,6,'d',{cols:3,sp:34,from:[-150,320],step:60,act:'hold',seed:20});
    const seq = W.crowd(200,40,6,'a',{cols:3,sp:40,step:60,seed:40});
    let flip=false;
    W.later(()=>W.every(()=>{ flip=!flip; seq.forEach((g,i)=>{ const goA = (i%2===0)===flip; g.walkTo(goA?140+(i%3-1)*26:260+(i%3-1)*26, -40+Math.floor(i/3)*30, gg=>{ gg.act('hold'); if(i===0) gg.say(goA?'Ahora pruebo A':'Ahora pruebo B',1400); }); }); },3200),1200);
    W.label(-225,0,170,'Monádica · cada grupo, un producto','pill sm'); W.label(200,0,170,'Secuencial · todos prueban A y B','pill sm');
  }},

{ t:'¿La diferencia es significativa? (prueba t)', day:'X', dayt:'Prueba t de diferencia de medias', cam:[12,-12,1.05],
  s:'La prueba t compara la diferencia contra lo que el azar podría producir (α = 0,05). <b>Mueve las medias y el tamaño de muestra</b> y mira al juez.',
  html:`<div class="f">H0: μA = μB &nbsp;·&nbsp; H1: μA ≠ μB</div>
  <div class="f">EE = √(s²A/nA + s²B/nB) = √(1,44/100 + 1,96/100) = 0,184<br>t = (5,8 − 5,1) ÷ 0,184 = <span class="hl-b">3,80</span></div>
  <p>Si |t| &gt; <b>1,96</b> (zona roja) <b class="hl-a">rechazamos H0</b>: la diferencia es real, no azar.</p>
  <div class="tip"><b>En Excel:</b> <code>=PRUEBA.T(rangoA;rangoB;2;3)</code> da el p-valor; si p &lt; 0,05 es significativa.</div>`,
  legend:[['d','No rechazo H0'],['c','Rechazo H0 (5%)'],['b','t calculado']],
  quiz:{q:'Con las mismas medias (5,8 y 5,1), ¿qué pasa con t si la muestra baja de 100 a 20 por grupo?',o:['t sube','t baja y puede dejar de ser significativo','t no cambia','t se vuelve negativo'],a:1,fb:'Con menos casos el error estándar crece, t baja (≈1,70) y ya no supera 1,96. ¡Pruébalo con el control!'},
  build(W){
    W.step=20;
    for (let z=-4; z<=4.001; z+=0.25){ const h = 250*Math.exp(-z*z/2); W.bar(z*82,-30,Math.max(h,3),Math.abs(z)>1.96?'c':'d',{w:17,d:60}); }
    W.step=70;
    W.label(-1.96*82,-30,50,'−1,96','pill sm'); W.label(1.96*82,-30,50,'+1,96','pill sm'); W.label(0,-30,50,'0','pill sm');
    const G = W.group(3.8*82,0,40);
    G.W.bar(0,0,180,'b',{w:14,d:14,delay:1500});
    const tl = G.W.label(0,215,0,'t = 3,80','val',{color:'b',delay:1800});
    const judge = W.guy(-270,110,{i:2,c:'w',s:1.5,from:[-460,260],act:'cheer',say:'¡Significativa! Rechazo H0',delay:1200,click:g=>g.say('Si |t| > 1,96 la diferencia no es azar',2500)});
    return {G,tl,judge,mA:5.8,mB:5.1,n:100};
  },
  ui(U,R){
    U.title('Laboratorio · prueba t');
    const res = U.out();
    const upd = ()=>{ const ee=Math.sqrt(1.44/R.n+1.96/R.n), t=(R.mA-R.mB)/ee, x=Math.max(-4.4,Math.min(4.4,t))*82;
      R.G.moveTo(x,40); R.tl.innerHTML='t = '+t.toFixed(2).replace('.',',');
      const sig = Math.abs(t)>1.96;
      res.innerHTML = `EE = ${ee.toFixed(3).replace('.',',')} · t = <b class="hl-b">${t.toFixed(2).replace('.',',')}</b> → ${sig?'<b class="hl-a">significativa (rechazo H0)</b>':'<b class="hl-c">no significativa (puede ser azar)</b>'}`;
      if (sig) R.judge.act('cheer').say('¡Significativa! Rechazo H0',2000); else R.judge.act('think').say('Mmm… podría ser azar',2000,true);
    };
    U.slider('Media A',4,7,0.1,5.8,v=>{R.mA=v;upd();},fx);
    U.slider('Media B',4,7,0.1,5.1,v=>{R.mB=v;upd();},fx);
    U.slider('n por grupo',10,200,10,100,v=>{R.n=v;upd();});
    res.innerHTML='EE = 0,184 · t = <b class="hl-b">3,80</b> → <b class="hl-a">significativa (rechazo H0)</b>';
  }},

    [-260,-170,260,340].forEach((x,k)=>W.guy(x,90,{i:30+k,c:['e','a','c','d'][k],s:1.3,from:[x<0?-480:480,250],act:'cheer',say:L[k],sayFor:2200,delay:500+k*250,click:g=>g.act('cheer').say(L[(k+1)%4],1800)}));
    W.board(-320,190,-60,`<div class="k">Mejorar</div><ul><li>Precio</li><li>Textura</li></ul>`,{w:150,accent:'c'});
    W.board(330,190,-60,`<div class="k">Mantener</div><ul><li>Sabor</li><li>Empaque</li></ul>`,{w:150,accent:'a'});
  }}
]};
})();

<script>
(function(){
'use strict';
const C = window.COURSE;
const vp = document.getElementById('vp');
const world = document.getElementById('world');
const $ = s => document.querySelector(s);
const COL = {a:'#2dd4bf',b:'#fbbf24',c:'#fb7185',d:'#60a5fa',e:'#a78bfa',g:'#64748b',w:'#e2e8f0'};
const col = c => COL[c] || c;
const SKIN = ['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac','#d1a27a'];
const HAIR = ['#2d1b0e','#111827','#6b3e26','#a0522d','#3b2f2f','#d4a017'];

/* ---------- camera ---------- */
let cam = {rx:20, ry:-28, z:1, ty:0}, tgt = {...cam};
let base = 1, dragging = false, lastInteract = -1e9;
function layout(){
  const w = innerWidth, h = innerHeight, mobile = w < 860;
  base = mobile ? Math.min(w/820, h/1250) : Math.min((w-440)/920, h/760);
  base = Math.max(.32, Math.min(base, 1.25));
  document.documentElement.style.setProperty('--cx', mobile ? '50%' : (440 + (w-440)/2) + 'px');
  document.documentElement.style.setProperty('--cy', mobile ? '40%' : '60%');
}
addEventListener('resize', layout); layout();
function frame(t){
  const k = dragging ? .35 : .075;

  const idle = performance.now() - lastInteract > 2500;

  world.style.setProperty('--ry', ry.toFixed(3)+'deg');
  world.style.transform = `translate3d(0,${cam.ty*base}px,0) scale(${(cam.z*base).toFixed(4)}) rotateX(${(-cam.rx).toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg)`;
    for (const g of GUYS){ if (!g.mk.isConnected){ GUYS.delete(g); g.el.remove(); continue; }
    const r = g.mk.getBoundingClientRect(), sc = r.height/100;
    g.el.style.transform = `translate(${(r.left + r.width/2 - 130).toFixed(1)}px,${(r.bottom - 190).toFixed(1)}px) scale(${sc.toFixed(3)})`;
    g.el.style.zIndex = Math.round(r.bottom); }

}
const GUYS = new Set();
const OV = document.getElementById('ov');
requestAnimationFrame(frame);

let sx=0, sy=0, moved=false, pid=null;
vp.addEventListener('pointerdown', e=>{
  if (e.target.closest('.ia,.click')) return;
  pid=e.pointerId; sx=e.clientX; sy=e.clientY; moved=false; vp.setPointerCapture(pid);
});
vp.addEventListener('pointermove', e=>{
  if (pid!==e.pointerId) return;

  if (!moved && Math.hypot(dx,dy) > 6){ moved=true; dragging=true; vp.classList.add('drag'); }
  if (moved){ tgt.ry += dx*0.32; tgt.rx = Math.max(2, Math.min(75, tgt.rx - dy*0.25)); sx=e.clientX; sy=e.clientY; lastInteract=performance.now(); }
});
function up(e){ if (pid!==e.pointerId) return; pid=null; dragging=false; vp.classList.remove('drag'); if(!moved && e.type==='pointerup') go(cur+1); }
vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
vp.addEventListener('wheel', e=>{ e.preventDefault(); tgt.z = Math.max(.5, Math.min(1.8, tgt.z * (e.deltaY>0 ? .93 : 1.07))); lastInteract=performance.now(); }, {passive:false});

/* ---------- helpers ---------- */
function el(cls, html){ const d=document.createElement('div'); d.className=cls; if(html!=null) d.innerHTML=html; return d; }
function cuboid(w,h,d,c,text){
  const cb = el('cub'); cb.style.setProperty('--c', col(c));
  const names=['f','b','r','l','t','u'], faces = names.map(n=>{ const f=el('fc '+n); if(n==='f'&&text) f.appendChild(el('ft',text)); cb.appendChild(f); return f; });
  cb._sz = (w,h,d)=>{
    const S = [[w,h,`translateZ(${d/2}px)`],[w,h,`rotateY(180deg) translateZ(${d/2}px)`],[d,h,`rotateY(90deg) translateZ(${w/2}px)`],
               [d,h,`rotateY(-90deg) translateZ(${w/2}px)`],[w,d,`rotateX(90deg) translateZ(${h/2}px)`],[w,d,`rotateX(-90deg) translateZ(${h/2}px)`]];
    S.forEach(([fw,fh,tr],i)=>{ faces[i].style.cssText = `width:${fw}px;height:${fh}px;left:${-fw/2}px;top:${-fh/2}px;transform:${tr}`; });
  };
  cb._sz(w,h,d); return cb;
}
function setXYZ(b,x,y,z){ b.style.setProperty('--x', x+'px'); b.style.setProperty('--y', (-y)+'px'); b.style.setProperty('--z', z+'px'); }
const hash = i => { const v = Math.sin(i*127.1+311.7)*43758.5453; return v - Math.floor(v); };

/* ---------- builder ---------- */
function makeW(root, ctx){
  const later = (fn,ms)=>{ const id=setTimeout(()=>{ if(!ctx.dead) fn(); },ms); ctx.timers.push(()=>clearTimeout(id)); return id; };
  const every = (fn,ms)=>{ const id=setInterval(()=>{ if(ctx.dead) clearInterval(id); else fn(); },ms); ctx.timers.push(()=>clearInterval(id)); return id; };
  const W = {
    later, every, root,
    get delay(){return ctx.delay}, set delay(v){ctx.delay=v},
    get step(){return ctx.step}, set step(v){ctx.step=v},
    _d(o){ if (o && o.delay!=null) return o.delay; const d = ctx.delay + ctx.t; ctx.t += ctx.step; return d; },
    bar(x,z,h,c,o={}){
      const w=o.w||50, d=o.d||50, by=o.base||0, dl=W._d(o);
      const p = el('pos'); p.style.transform = `translate3d(${x}px,${-by}px,${z}px)`;
      const g = el('grow'); g.style.transitionDelay = dl+'ms';
      let ch = h; const ah0 = Math.max(Math.abs(h),1.5);
      const cb = cuboid(w, ah0, d, c, o.text); cb.style.transform = `translate3d(0,${h>=0 ? -ah0/2 : ah0/2}px,0)`;
      g.appendChild(cb); p.appendChild(g); root.appendChild(p);
      const vy = hh => by + (hh>=0 ? hh+34 : hh-34);
      const lab = o.val!=null ? W.label(x, vy(h), z, o.val, 'val', {delay:dl+500, color:o.valColor}) : null;
      if (o.cat!=null) W.label(x, -30, z + d/2 + (o.catOff||48), o.cat, 'sm', {delay:dl+300});
      if (o.click){ p.classList.add('click'); }
      const api = { el:p, cb, label:lab, get h(){return ch;},
        set(nh, opt={}){
          if (opt.c) cb.style.setProperty('--c', col(opt.c));
          if (opt.val!=null && lab) lab.innerHTML = opt.val;
          const from = ch, n = opt.instant ? 1 : 5; let k = 0; ch = nh;
          clearInterval(api._t);
          const tick = ()=>{ k++; const hh = from + (nh-from)*k/n, ah = Math.max(Math.abs(hh),1.5);
            cb._sz(w,ah,d); cb.style.transform = `translate3d(0,${hh>=0 ? -ah/2 : ah/2}px,0)`; if (lab) setXYZ(lab,x,vy(hh),z);
            if (k>=n) clearInterval(api._t); };
          tick(); if (n>1) api._t = every(tick, 70);
        }};
      return api;
    },
    block(x,y,z,w,h,d,c,o={}){
      const dl=W._d(o);
      const p = el('pos'); p.style.transform = `translate3d(${x}px,${-y}px,${z}px)` + (o.rotY?` rotateY(${o.rotY}deg)`:'');
      const g = el('pop'); g.style.transitionDelay = dl+'ms';
      const cb = cuboid(w,h,d,c,o.text); g.appendChild(cb); p.appendChild(g); root.appendChild(p);
      if (o.click){ cb.querySelectorAll('.fc').forEach(f=>{ f.classList.add('click'); f.addEventListener('click', ev=>{ ev.stopPropagation(); o.click(); }); }); }
      return {el:p, cb, setColor:c=>cb.style.setProperty('--c',col(c))};
    },
    label(x,y,z,html,cls='',o={}){
      const dl=W._d(o);
      const b = el('bb fade lbl '+cls + (o.anchor==='b'?' anchor-b':''), html);
      setXYZ(b,x,y,z); b.style.transitionDelay = dl+'ms'; if (o.color) b.style.color = col(o.color);
      if (o.w) { b.style.width=o.w+'px'; b.style.whiteSpace='normal'; b.style.textAlign = o.align||'center'; }
      if (o.click){ b.classList.add('click'); b.addEventListener('click', ev=>{ ev.stopPropagation(); o.click(b); }); }
      root.appendChild(b); return b;
    },
    board(x,y,z,html,o={}){
      const b = W.label(x,y,z,html,'board',o);
      b.style.width = (o.w||260)+'px'; b.style.textAlign='left';
      if (o.accent) b.style.borderTop = `3px solid ${col(o.accent)}`;
      return b;
    },
    tile(x,z,w,d,c,o={}){
      const dl=W._d(o), y=o.y||0;
      const t = el('tile fade'); t.style.transform = `translate3d(${x}px,${-y-0.5}px,${z}px) rotateX(90deg)`;
      t.style.transitionDelay = dl+'ms';
      const inner = el(o.cls||'', o.html||null);
      inner.style.cssText += `width:${w}px;height:${d}px;background:${o.bg || col(c)};border-radius:${o.r??10}px;${o.css||''}`;
      t.appendChild(inner); root.appendChild(t); t._in = inner; return t;
    },
    plane(x,y,z,w,d,o={}){
      const dl=W._d(o);
      const t = el('tile fade'); const pos = yy => `translate3d(${x}px,${-yy}px,${z}px) rotateX(90deg)`;
      t.style.transform = pos(y); t.style.transitionDelay = dl+'ms';
      const inner = el('plane'); inner.style.width=w+'px'; inner.style.height=d+'px';
      if (o.color){ inner.style.borderColor=col(o.color); inner.style.background=`color-mix(in srgb, ${col(o.color)} 14%, transparent)`; }
      t.appendChild(inner); root.appendChild(t);
      const lab = o.label ? W.label(x + w/2 + (o.lo||70), y, z, o.label, 'pill sm', {delay:dl+200, color:o.color}) : null;
      return {el:t, label:lab, setY(yy, text){ t.style.transform = pos(yy); if(lab){ setXYZ(lab, x + w/2 + (o.lo||70), yy, z); if(text!=null) lab.innerHTML=text; } }};
    },
    /* stop-motion character */
    guy(x,z,o={}){
      const dl = W._d(o), i = o.i ?? Math.floor(Math.random()*1000);
      const mk = el('bb anchor-b gmk'); root.appendChild(mk);
      const b = el('guy fade');
      b.innerHTML = `<div class="gf"><div class="gy"><div class="gb"><div class="fl"><span class="shadow"></span><span class="leg l"></span><span class="leg r"></span><span class="arm l"></span><span class="torso"></span><span class="arm r"></span><span class="head"><i class="hair"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></span></div></div></div><div class="bub"></div></div>`;
      b.style.transitionDelay = dl+'ms';
      b.style.setProperty('--sh', col(o.c||'d')); b.style.setProperty('--sk', o.skin||SKIN[Math.floor(hash(i)*SKIN.length)]);
      b.style.setProperty('--hr', o.hair||HAIR[Math.floor(hash(i+7)*HAIR.length)]); b.style.setProperty('--pt', o.pants||PANT[Math.floor(hash(i+3)*PANT.length)]);
      const s = o.s || 1; b.querySelector('.gf').style.transform = `scale(${s})`;
      b.querySelector('.gy').style.animationDelay = (-hash(i+1)*0.44).toFixed(2)+'s';
      const torso = b.querySelector('.torso'), bub = b.querySelector('.bub');
      if (o.tag!=null) torso.textContent = o.tag;
      const g = { el:b, x:o.from?o.from[0]:x, z:o.from?o.from[1]:z, y:o.y||0, acts:['wave','cheer','think','point','talk','sad','hold'],
        mk, pos(){ setXYZ(mk, g.x, g.y, g.z); },
        act(a){ g.acts.forEach(k=>b.classList.remove(k)); if (a) a.split(' ').forEach(k=>b.classList.add(k)); return g; },
        say(t, ms, think){ g._touched = true; bub.innerHTML = t; bub.classList.toggle('th', !!think); bub.classList.add('on'); clearTimeout(g._sb); if (ms) g._sb = later(()=>bub.classList.remove('on'), ms); return g; },
        hush(){ bub.classList.remove('on'); return g; },
        color(c){ b.style.setProperty('--sh', col(c)); return g; },
        tag(t){ torso.textContent = t; return g; },
        face(dx){ b.classList.toggle('flip', dx<0); },
        walkTo(tx,tz,cb,sp){
          sp = sp || o.speed || 24; clearInterval(g._w); b.classList.add('walk'); g.act(null);
          if (Math.abs(tx-g.x) > 1) g.face(tx-g.x);
          g._w = every(()=>{ const dx=tx-g.x, dz=tz-g.z, L=Math.hypot(dx,dz);
            if (L<=sp){ g.x=tx; g.z=tz; g.pos(); clearInterval(g._w); b.classList.remove('walk'); cb && cb(g); return; }
            g.x+=dx/L*sp; g.z+=dz/L*sp; g.pos(); }, 115);
          return g;
        },
        hopTo(tx,ty,tz,cb){ /* jump in 4 stop-motion frames */
          const fx=g.x, fy=g.y, fz=g.z; let k=0; clearInterval(g._w); g.face(tx-fx);
          g._w = every(()=>{ k++; const f=k/4; g.x=fx+(tx-fx)*f; g.z=fz+(tz-fz)*f; g.y=fy+(ty-fy)*f + Math.sin(f*Math.PI)*28; g.pos(); if(k>=4){ clearInterval(g._w); cb&&cb(g);} }, 110);
          return g;
        }
      };
      g.pos(); ctx.ov.appendChild(b); GUYS.add(g);
      if (o.flip) g.face(-1);
      if (o.click){ b.classList.add('ia'); b.addEventListener('click', ev=>{ ev.stopPropagation(); o.click(g); }); }
      const start = ()=>{ if (g._touched) return; if (o.act) g.act(o.act); if (o.say) g.say(o.say, o.sayFor, o.think); };
      if (o.from) later(()=>g.walkTo(x,z,()=>{ if(o.faceEnd!=null) g.face(o.faceEnd); start(); o.arrive && o.arrive(g); }), dl+150);
      else later(start, dl + 400);
      return g;
    },
    crowd(cx,cz,count,c,o={}){
      const cols = o.cols || Math.ceil(Math.sqrt(count)), sp = o.sp || 36, rows = Math.ceil(count/cols);
      const save = ctx.step; ctx.step = o.step ?? 40; const out=[];
      for (let i=0;i<count;i++){
        const r = Math.floor(i/cols), k = i%cols;
        const x = cx + (k-(cols-1)/2)*sp + (o.jit? (hash(i)-.5)*o.jit : 0), z = cz + (r-(rows-1)/2)*sp*0.9;
        const from = o.from ? [o.from[0] + (hash(i+9)-.5)*120, o.from[1] + (hash(i+5)-.5)*80] : null;
        out.push(W.guy(x, z, Object.assign({}, o.g||{}, {i:(o.seed||0)+i, c: typeof c==='function'? c(i): c, from, act:o.act, s:o.s, click:o.click ? (g=>o.click(g,i)) : null, tag: o.tag? o.tag(i): null})));
      }
      ctx.step = save; return out;
    },
    bars(list,o={}){
      const gap=o.gap||95, w=o.w||56, d=o.d||56, sc=o.scale||1, z=o.z||0;
      const x0 = (o.x||0) - (list.length-1)*gap/2;
      return list.map((it,i)=> W.bar(x0+i*gap, z, it.v*sc, it.c||o.c||'a', {w,d,val:it.val??it.v, cat:it.cat, base:o.base, valColor:it.vc, text:it.text}));
    },
    arrow(x1,z1,x2,z2,c='w',o={}){
      const dx=x2-x1, dz=z2-z1, L=Math.hypot(dx,dz), ang=Math.atan2(dz,dx)*180/Math.PI, dl=W._d(o), y=o.y||1;
      const t = el('tile fade'); t.style.transform = `translate3d(${(x1+x2)/2}px,${-y}px,${(z1+z2)/2}px) rotateY(${-ang}deg) rotateX(90deg)`;
      t.style.transitionDelay = dl+'ms';
      const a = el(''); a.style.cssText = `position:absolute;transform:translate(-50%,-50%);width:${L}px;height:26px;background:linear-gradient(90deg,transparent,${col(c)} 18%);clip-path:polygon(0 40%,calc(100% - 22px) 40%,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,calc(100% - 22px) 60%,0 60%);opacity:.9`;
      t.appendChild(a); root.appendChild(t); return t;
    },
    group(x,y,z){
      const p = el('pos'); root.appendChild(p);
      const G = { el:p, x, y, z, W: makeW(p, ctx),
        set(nx,ny,nz){ G.x=nx; G.y=ny; G.z=nz; p.style.transform = `translate3d(${nx}px,${-ny}px,${nz}px)`; },
        moveTo(tx,tz,cb){ const fx=G.x, fz=G.z; let k=0; clearInterval(G._t);
          G._t = every(()=>{ k++; G.set(fx+(tx-fx)*k/6, G.y, fz+(tz-fz)*k/6); if(k>=6){ clearInterval(G._t); cb&&cb(); } }, 90); } };
      G.set(x,y,z); return G;
    }
  };
  return W;
}

/* ---------- panel UI helpers ---------- */
function makeU(box){
  const U = {
    title(t){ box.appendChild(el('ttl', t)); },
    slider(label,min,max,step,val,fn,fmt=v=>v){
      const r = el('row'); const l = el('', label); const inp = document.createElement('input');
      inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=val;
      const out = document.createElement('output'); out.textContent = fmt(+val);
      inp.addEventListener('input', ()=>{ out.textContent = fmt(+inp.value); fn(+inp.value); });
      r.append(l, inp, out); box.appendChild(r); return inp;
    },
    btns(list){ const r = el('btns'); const bs = list.map(([t,fn])=>{ const b=document.createElement('button'); b.textContent=t; b.onclick=()=>fn(b); r.appendChild(b); return b; }); box.appendChild(r); return bs; },
    out(html=''){ const d = el('res', html); box.appendChild(d); return d; }
  };
  return U;
}

/* ---------- steps ---------- */
const steps = C.steps; let cur = -1, layer = null, ovl = null, ctx = null;
const quizRes = {};
document.title = C.title + ' · 3D';
$('#kick').textContent = C.kicker; $('#title').textContent = C.title; $('#sub').textContent = C.sub;
$('#back').href = C.back;
const dots = $('#dots');
steps.forEach((s,i)=>{ const b=document.createElement('button'); b.className = s.day||''; b.title = `${i+1}. ${s.t}`; b.setAttribute('aria-label', b.title); b.onclick=()=>go(i); dots.appendChild(b); });
const DAY = {M:'Martes', X:'Miércoles'};
const nQuiz = steps.filter(s=>s.quiz).length;
function score(){ const ok = Object.values(quizRes).filter(Boolean).length; $('#score').textContent = nQuiz ? `★ Retos ${ok}/${nQuiz}` : ''; }
function renderQuiz(i){
  const s = steps[i], box = $('#quiz'); box.innerHTML = '';
  if (!s.quiz) return;
  const q = s.quiz, w = el('qz'); w.appendChild(el('ttl','★ Reto rápido')); w.appendChild(el('q', q.q));
  const ops = el('ops'), fb = el('fb');
  q.o.forEach((t,k)=>{ const b=document.createElement('button'); b.innerHTML=t; b.onclick=()=>{
    if (i in quizRes) return;
    quizRes[i] = k===q.a; [...ops.children].forEach((x,j)=>{ if(j===q.a) x.classList.add('ok'); else if(j===k) x.classList.add('no'); });
    fb.innerHTML = (k===q.a ? '<b class="hl-a">¡Correcto!</b> ' : '<b class="hl-c">Casi.</b> ') + q.fb; score();
    if (ctx && ctx.onQuiz) ctx.onQuiz(k===q.a);
  }; ops.appendChild(b); });
  w.append(ops, fb); box.appendChild(w);
  if (i in quizRes){ const k = quizRes[i] ? q.a : -1; [...ops.children][q.a].classList.add('ok'); fb.innerHTML = (quizRes[i]?'<b class="hl-a">¡Correcto!</b> ':'<b class="hl-c">Ya respondiste.</b> ') + q.fb; }
}
function go(i){
  if (i<0 || i>=steps.length || i===cur) return;
  cur = i; const s = steps[i];
  if (ctx){ ctx.dead = true; ctx.timers.forEach(f=>f()); }
  if (layer){ const old = layer, oo = ovl; [old,oo].forEach(x=>{ x.classList.remove('on'); x.classList.add('out'); }); setTimeout(()=>{ old.remove(); oo.remove(); }, 450); }
  layer = el('layer'); world.appendChild(layer);
  ovl = el('layer ovl'); OV.appendChild(ovl);
  ctx = {t:0, delay:250, step:70, timers:[], dead:false, ov:ovl};
  const W = makeW(layer, ctx);
  const R = (s.build && s.build(W)) || {};
  { const L=layer, O=ovl; requestAnimationFrame(()=>requestAnimationFrame(()=>{ L.classList.add('on'); O.classList.add('on'); })); }
  const c = s.cam || [];
  tgt = {rx:c[0]??20, ry:c[1]??-28, z:c[2]??1, ty:c[3]??0};
  $('#num').textContent = i===0 ? 'Inicio' : `Paso ${i} de ${steps.length-1}`;
  const day = $('#day'); day.className = 'day ' + (s.day||''); day.textContent = s.day ? DAY[s.day]+' · '+(s.dayt||'') : (s.dayt||'Caso Quinua Fresh');
  $('#h').textContent = s.t; $('#lead').innerHTML = s.s || ''; $('#body').innerHTML = s.html || '';
  const ia = $('#ia'); ia.innerHTML = ''; if (s.ui) s.ui(makeU(ia), R, W);
  if (R.onQuiz) ctx.onQuiz = R.onQuiz;
  renderQuiz(i); score();
  $('#panel').scrollTop = 0;
  $('#prev').disabled = i===0; $('#next').textContent = i===steps.length-1 ? 'Volver al inicio ↺' : (i===0 ? 'Empezar ▶' : 'Siguiente ▶');
  [...dots.children].forEach((b,k)=>{ b.classList.toggle('cur', k===i); b.classList.toggle('done', k<i); });
  $('#prog').style.width = (i/(steps.length-1)*100)+'%';
  $('#legend').innerHTML = (s.legend||[]).map(([c,t])=>`<span><i style="background:${col(c)}"></i>${t}</span>`).join('');
  try { history.replaceState(null,'', '#paso-'+i); } catch(e){}
}
$('#prev').onclick = ()=>go(cur-1);
$('#next').onclick = ()=> cur===steps.length-1 ? go(0) : go(cur+1);
addEventListener('keydown', e=>{
  if (e.target && e.target.tagName==='INPUT') return;
  if (e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); go(cur+1); }
  if (e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
});
const m = /^#paso-(\d+)$/.exec(location.hash||''); go(m ? Math.min(+m[1], steps.length-1) : 0);
window.__go = go;
})();

</script>
</body>
</html>
